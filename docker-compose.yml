# Dirge of Cerberus (the 2006 PlayStation 2 online mode) for the OpenLobby
# core. This file is an OVERRIDE of OpenLobby's compose file, not a stack of
# its own: the responder runs in OpenLobby's compose project, beside the
# core, on its network, with its PostgreSQL database (the account and session
# tables that name the player at each console, and this title's own doc_*
# tables: characters, wallets, gear, play time, careers, rankings and units)
# and its logs volume. With both repositories checked out side by side, from
# this directory:
#
#   cp .env.example .env      # set POL_ADVERTISE to your server's LAN/VPN IP
#   docker compose --project-directory ../openlobby \
#       --env-file ../openlobby/.env --env-file .env \
#       -f ../openlobby/docker-compose.yml -f docker-compose.yml \
#       up -d --build doc
#
# (OpenLobby's .env first, so its POL_DB_PASSWORD reaches the connection
# string below; this repository's .env second, for the POL_DOC_* knobs.)
#
# Build the core image first (openlobby:latest, `docker compose build` in
# ../openlobby) or point OPENLOBBY_IMAGE at the one you use: this image is
# built on it. The console reaches this service by name: the core's DNS
# answers kel-1001.pol.com with the advertised address, and the game dials
# UDP 55040.
#
# Relative paths below resolve against ../openlobby (the project directory).

services:
  doc:
    image: crystaldirge:latest
    build:
      context: ../crystaldirge
      args:
        OPENLOBBY_IMAGE: "${OPENLOBBY_IMAGE:-openlobby:latest}"
    pull_policy: build
    restart: unless-stopped
    ports:
      - "55040:55040/udp"
    volumes:
      - pol-logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # OpenLobby's PostgreSQL (its docs/database.md). The responder's tables
      # are CrystalDirge's own migrations (doc_*), applied at start.
      POL_DATABASE_URL: "postgresql://openlobby:${POL_DB_PASSWORD:-openlobby}@postgres:5432/openlobby"
      # The address handed to a client is chosen per client (docworld/advertise.py
      # host_for): POL_ADVERTISE_PUBLIC for a peer with a global address,
      # POL_ADVERTISE_LAN for a private-range peer. Empty = POL_ADVERTISE.
      POL_ADVERTISE_PUBLIC: "${POL_ADVERTISE_PUBLIC:-}"
      POL_ADVERTISE_LAN: "${POL_ADVERTISE_LAN:-}"
    # The argument set below is the one the private deployment runs; each
    # flag is documented in docudp.py --help. The addresses are the advertised
    # host; the stores are PostgreSQL tables (docdb.py).
    command:
      - "--mode=subtype"
      - "--subtype=4"
      - "--frag3"
      - "--frag3-servers=${POL_ADVERTISE:-127.0.0.1}:55040"
      - "--lobby-ip=${POL_ADVERTISE:-127.0.0.1}"
      - "--lobby-probe=advance"
      # optional allowlist of console addresses (comma-separated); empty
      # answers whoever asks, each address as its own session
      - "--peer=${POL_DOC_PEER:-}"
      - "--lobby-keepalive-ms=12000"
      - "--lobby-chara-count=4"
      - "--lobby-chara-used"
      - "--lobby-chara-name=${POL_DOC_CHARA_NAME:-Quarry}"
      - "--lobby-chara-allow=16"
      # persistent per-player characters, keyed by the core member signed in
      # at the console's address (the login service's session table)
      - "--chara-store=on"
      - "--pol-members=on"
      - "--self-costume-auto"
      - "--self-costume-file=/logs/doc-self-costume.txt"
      - "--lobby-spawn=east"
      - "--user-list"
      - "--battletable-probe"
      - "--pending-ack-after=13,17,27"
      - "--short-ladder=22"
      - "--bt-no-onfly-reserve"
      - "--reliable-ack-ingame"
      - "--gs-connect"
      - "--gs-connect-selectors=104"
      - "--gs-connect-id=65535"
      - "--user-zone=65535"
      - "--user-list-sweep=32"
      - "--user-list-selector=19"
      - "--peer-push"
      - "--user-costume=0x1012"
      - "--world-self-charaid"
      - "--bt-start-ready"
      - "--peer-answer"
      # relay the other consoles' avatars into each session (raw, wu, off)
      - "--peer-relay=${POL_DOC_PEER_RELAY:-raw}"
      # the lobby NPC placement push; needs tools/doc_npc_table.json (README)
      - "--npc-spawn=${POL_DOC_NPC_SPAWN:-off}"
      - "--npc-spawn-only=${POL_DOC_NPC_SPAWN_ONLY:-}"
      - "--npc-arena=${POL_DOC_NPC_ARENA:-off}"
      - "--rankings=on"
      - "--shop=on"
      - "--units=on"
      - "--stats=on"
      # Mission Mode: the per-player mission ledger (the instructors grant the
      # rank exams into it; on/off), which situation a quest's arena loads
      # (QUEST:SITUATION pairs) and the enemy types a mission situation's NPC
      # slots are given (see docudp.py --help). The mission enemies' spawn
      # points are the arena's own data and are read from
      # tools/doc_mission_spawns.json when you supply it (README.md).
      - "--mission-ledger=${POL_DOC_MISSION_LEDGER:-on}"
      - "--quest-situations=${POL_DOC_QUEST_SITUATIONS:-39:3001,40:3001}"
      - "--mission-npc-types=${POL_DOC_MISSION_NPC_TYPES:-q39:3,3;3001:3,3,0;4,0,5,6,7,8,9,10,11,12}"
